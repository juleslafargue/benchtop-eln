# Benchtop's automatic tests. GitHub runs this on every push and pull request.
# Results: the Actions tab of the repository (a green tick or red cross next to each commit).
# ./benchtop keeps .github/workflows/tests.yml in step with this file (deploy/github-tests.yml).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  BENCHTOP_NMR_AUTO_UPDATE: "off"
  BENCHTOP_UPDATE_CHECK: "off"
  BENCHTOP_PUBCHEM: "off"

jobs:
  backend:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Run the tests
        working-directory: backend
        env:
          BENCHTOP_ELN_SAMPLE: /tmp/eln-sample  # one test leaves a .eln export here for the next step
        run: mkdir -p /tmp/eln-sample && python -m pytest -q
      - name: The .eln export passes the ELN Consortium's own checks
        run: |
          git clone -q https://github.com/TheELNConsortium/TheELNFileFormat.git /tmp/eln-spec
          git -C /tmp/eln-spec checkout -q 89265e52d654254396c8bb2cbbcb53131bcd29f8
          pip install -q jsonschema roc-validator rocrate
          f=$(ls /tmp/eln-sample/*.eln)
          cd /tmp/eln-spec
          # the recommended rules too, reported as notes on the run
          python tests/run_checks.py "$f" > /tmp/eln-all.txt 2>&1 || true
          grep -E "ERROR|WARNING|failed" /tmp/eln-all.txt | head -40 | while IFS= read -r l; do echo "::notice title=.eln (recommended)::$l"; done
          # the required rules must pass
          if ! python tests/run_checks.py --no-recommend "$f" > /tmp/eln-req.txt 2>&1; then
            cat /tmp/eln-req.txt
            grep -E "ERROR|failed|Error" /tmp/eln-req.txt | head -40 | while IFS= read -r l; do echo "::error title=.eln check::$l"; done
            exit 1
          fi
          cat /tmp/eln-req.txt

  upgrades:
    # Data made by each released version (backend/tests/upgrades/), restored and upgraded by this code: nothing lost,
    # signed records still verify, every record and file opens. The server tests try five of them; this tries all.
    name: Upgrades from every past version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt pytest-xdist
      - name: Restore, upgrade and open each version's data
        working-directory: backend
        env:
          BENCHTOP_UPGRADE_TESTS: all
        run: python -m pytest -q -n 4 tests/test_v24_upgrades.py

  fuzzing:
    # Thousands of odd but well-formed requests to every endpoint (Schemathesis), as a scientist, an admin, a viewer
    # and with no sign-in: Benchtop must answer each with a result or a plain refusal, never a server error.
    name: API fuzzing (every endpoint, odd requests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Fuzz the API
        working-directory: backend
        run: python tests/fuzz_api.py

  crashes:
    # Benchtop killed without warning (as a power cut would) while people save, sign and attach files, while it backs
    # up, while it upgrades an old version's data and while it restores, then started again: nothing saved may be
    # lost or left half-done, and ./benchtop check must pass. A new random seed each run (printed, to repeat it).
    name: Pull-the-plug tests (killed mid-save, then restarted)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Kill Benchtop at random moments
        working-directory: backend
        run: python tests/crash_test.py

  frontend:
    name: Build the app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Frontend tests
        run: npm test
        working-directory: frontend
      - name: Type-check and build
        run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  browser:
    name: Browser check (every page, desktop, phone, dark mode)
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Open every page
        working-directory: backend
        env:
          BENCHTOP_PDF_SAMPLES: /tmp/pdf-samples  # the yearly archive and a record's PDF it makes, for the next step
        run: python tests/smoke_browser.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: The PDFs are valid PDF/A-3b (veraPDF, the reference validator)
        env:
          VERAPDF: "1.30.3"
          VERAPDF_SHA256: b512bf24945503a33fc10738ecffc1f2dccaaf8593a448e94ee9ac86a9559a59
        run: |
          curl -fsSL -o /tmp/verapdf.zip "https://software.verapdf.org/releases/1.30/verapdf-greenfield-$VERAPDF-installer.zip"
          echo "$VERAPDF_SHA256  /tmp/verapdf.zip" | sha256sum -c -
          unzip -q /tmp/verapdf.zip -d /tmp/verapdf-installer
          cat > /tmp/verapdf-auto.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir"><installpath>/tmp/verapdf</installpath></com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF CLI" selected="true"/>
              <pack index="2" name="veraPDF Documentation" selected="false"/>
              <pack index="3" name="veraPDF Sample Plugins" selected="false"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          java -jar "/tmp/verapdf-installer/verapdf-greenfield-$VERAPDF/verapdf-izpack-installer-$VERAPDF.jar" /tmp/verapdf-auto.xml
          /tmp/verapdf/verapdf --version
          ls -l /tmp/pdf-samples
          test -s /tmp/pdf-samples/archive-demo.pdf && test -s /tmp/pdf-samples/record.pdf
          failed=0
          for f in /tmp/pdf-samples/*.pdf; do
            echo "::group::veraPDF report for $(basename "$f")"
            /tmp/verapdf/verapdf --flavour 3b --format text --verbose "$f" || true
            echo "::endgroup::"
            /tmp/verapdf/verapdf --flavour 3b --format mrr "$f" > "$f.xml" || true
            if ! grep -q 'isCompliant="true"' "$f.xml" || grep -q 'isCompliant="false"' "$f.xml"; then
              echo "::error title=PDF/A::$(basename "$f") is not valid PDF/A-3b; the rules it fails:"
              grep -o '<rule [^>]*status="failed"[^>]*>' "$f.xml" | head -40
              grep -A3 '<rule [^>]*status="failed"' "$f.xml" | grep -o '<description>[^<]*' | sort -u | head -40
              failed=1
            fi
          done
          exit $failed
      - name: Open every page on the oldest demo lab (0.9.3), upgraded
        working-directory: backend
        run: python tests/smoke_browser.py --upgraded v0.9.3

  docker:
    name: Lab-server setup (Docker image builds, starts and backs up)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DC: docker compose -f deploy/docker-compose.server.yml --env-file deploy/.env
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the server setup (without the HTTPS proxy)
        run: |
          printf 'BENCHTOP_DOMAIN=eln.example.test\nBENCHTOP_SECRET_KEY=%s\nBENCHTOP_ADMIN_PASSWORD=ci-start-only\n' "$(openssl rand -hex 32)" > deploy/.env
          $DC up -d --build app
      - name: Benchtop answers, and writes its first backup to the host
        run: |
          for i in $(seq 1 60); do
            if $DC exec -T app python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" 2>/dev/null \
               && ls deploy/backups/benchtop-backup-*.zip >/dev/null 2>&1; then break; fi
            sleep 3
          done
          ls -l deploy/backups/
          ls deploy/backups/benchtop-backup-*.zip
          $DC exec -T app python -m app.backup test
      - name: A server that used Postgres refuses to start on an empty database
        run: |
          if docker compose -p guardcheck -f deploy/docker-compose.server.yml --env-file deploy/.env run --rm --no-deps \
               -e BENCHTOP_LEGACY_POSTGRES=was-set app > guard.txt 2>&1; then
            echo "It started, but it should have refused"; cat guard.txt; exit 1
          fi
          grep -q "still in Postgres" guard.txt || { cat guard.txt; exit 1; }
      - name: The server updates to a newer release, and goes back (deploy/update-server.sh)
        run: |
          git checkout -q -B main
          before=$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' backend/app/__init__.py)
          # pretend a newer release is out: a commit with a higher version, tagged as releases are
          sed -i -E 's/^__version__ = ".*"/__version__ = "99.0.0"/' backend/app/__init__.py
          git -c user.name=CI -c user.email=ci@example.invalid commit -qam "v99.0.0: pretend release"
          git tag v99.0.0
          git reset -q --hard HEAD~1
          n=$(ls deploy/backups/benchtop-backup-*.zip | wc -l)
          deploy/update-server.sh --yes
          v() { $DC exec -T app python -c "import json, urllib.request; print(json.load(urllib.request.urlopen('http://localhost:8000/api/health'))['version'])"; }
          test "$(v)" = 99.0.0
          test "$(ls deploy/backups/benchtop-backup-*.zip | wc -l)" -gt "$n"   # it backed up first
          deploy/update-server.sh --rollback --yes
          test "$(v)" = "$before"
      - name: Server log (if anything failed)
        if: failure()
        run: $DC logs app

  release:
    # When main has a version number with no release yet, and every test above passed: publish it on the Releases
    # page, with notes from the commits and a ready-to-run zip (interface built, so no Node needed). That's what
    # ./benchtop update, deploy/update-server.sh and the admin's "newer version" notice look for.
    name: Publish a release (when the version changed on main)
    needs: [backend, upgrades, fuzzing, crashes, frontend, browser, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Is this version released yet?
        id: v
        run: |
          v=$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' backend/app/__init__.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "new=no" >> "$GITHUB_OUTPUT"; echo "v$v is already released; nothing to do."
          else
            echo "new=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.new == 'yes'
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Build the zip and the notes
        if: steps.v.outputs.new == 'yes'
        run: python3 deploy/release.py --out release
      - name: Publish
        if: steps.v.outputs.new == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          gh release create "v$V" "release/benchtop-eln-v$V.zip" --title "Benchtop $V" \
            --notes-file release/notes.md --target "$GITHUB_SHA"
